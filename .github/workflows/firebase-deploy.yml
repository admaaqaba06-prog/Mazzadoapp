name: Deploy Firebase (rules, storage, functions)

# Keeps the Firebase backend in sync with main. firebase-hosting-deploy.yml
# already auto-deploys the FRONTEND on merge to main; this does the same for
# Firestore rules, Storage rules, and Cloud Functions — so the server never
# runs stale rules/functions while the frontend is current.

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'functions/**'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      # GATE: never ship Cloud Functions to production on a red suite. This job
      # deploys settlement, bidding, and payout code straight to prod, so the
      # money tests run FIRST and a failure aborts the deploy. CI runs the same
      # suite at PR time; this is the last line of defence for anything that
      # reaches main another way (direct push, hotfix, manual dispatch).
      - name: Install root dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Cloud Functions dependencies
        # functions/ has no package-lock.json, so use `npm install` (not `npm ci`).
        run: npm install --prefix functions

      # Official Google auth: writes the service-account key from the secret and
      # exports GOOGLE_APPLICATION_CREDENTIALS for all following steps. firebase-tools
      # authenticates via those Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Write the n8n env into functions/.env so the deployed functions can
      # read process.env.N8N_WEBHOOK_URL / N8N_OTP_WEBHOOK_URL / N8N_API_KEY /
      # N8N_BASE_URL. If a secret is unset/empty, the var is empty and
      # postToN8n()/pollN8nHealth() no-op — the notification pipe and health
      # poller stay inert.
      # N8N_BASE_URL falls back to the known n8n Cloud instance if the secret
      # is empty. functions/.env is git-ignored; it exists only on the CI runner.
      #
      # N8N_OTP_WEBHOOK_URL was READ by postOtpToRelay but never written here,
      # so setting that repo secret silently did nothing and the hardcoded
      # OTP_RELAY_URL always won. It is the documented way to repoint OTP at a
      # new n8n workspace without a code change, so it has to actually arrive.
      # Left empty it stays empty, and postOtpToRelay falls back to the
      # constant — same behaviour as before.
      # CR-02 adds three more. N8N_INBOUND_SECRET is the load-bearing one:
      # notificationsInbound FAILS CLOSED without it (503 on every request),
      # so an unset secret means every opt-out a customer sends is silently
      # dropped — the one failure this feature cannot detect on its own.
      # DIGEST_HOUR/DIGEST_MINUTE are read at DEPLOY time (the cron string is
      # baked into the Cloud Scheduler job); empty means 19:00 Amman. STOPPING
      # a send needs no redeploy — that lever is config/notifications.
      - name: Configure Functions env (n8n webhook + health poll)
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_OTP_WEBHOOK_URL: ${{ secrets.N8N_OTP_WEBHOOK_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
          N8N_INBOUND_SECRET: ${{ secrets.N8N_INBOUND_SECRET }}
          DIGEST_HOUR: ${{ vars.DIGEST_HOUR }}
          DIGEST_MINUTE: ${{ vars.DIGEST_MINUTE }}
        run: |
          printf 'N8N_WEBHOOK_URL=%s\n' "$N8N_WEBHOOK_URL" > functions/.env
          printf 'N8N_OTP_WEBHOOK_URL=%s\n' "$N8N_OTP_WEBHOOK_URL" >> functions/.env
          printf 'N8N_API_KEY=%s\n' "$N8N_API_KEY" >> functions/.env
          printf 'N8N_BASE_URL=%s\n' "${N8N_BASE_URL:-https://mazadjo.app.n8n.cloud}" >> functions/.env
          printf 'N8N_INBOUND_SECRET=%s\n' "$N8N_INBOUND_SECRET" >> functions/.env
          printf 'DIGEST_HOUR=%s\n' "${DIGEST_HOUR:-19}" >> functions/.env
          printf 'DIGEST_MINUTE=%s\n' "${DIGEST_MINUTE:-0}" >> functions/.env

      - name: Deploy rules, storage, and functions
        run: firebase deploy --only firestore,storage,functions --project mazadjoapp --non-interactive --force
