name: Deploy Firebase Hosting (frontend)

# Replaces Vercel's auto-deploy-on-merge for the frontend now that the app is
# on Firebase Hosting. firebase-deploy.yml keeps handling Firestore rules,
# Storage rules, and Cloud Functions; this workflow builds and ships the
# static frontend (dist/) on every push to main, same trigger shape Vercel
# used to run.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Pinned so the build never silently falls back to the values hardcoded
          # in src/services/firebase.ts. Those came from a Google AI Studio
          # scaffold, and one of them broke Google sign-in on the bare apex after
          # the move off Vercel — the fallbacks were never meant to be load-bearing.
          #
          # VITE_FIREBASE_AUTH_DOMAIN is deliberately ABSENT: it resolves per host
          # at runtime (src/utils/authDomain.ts) so sign-in works on both
          # mazad-jo.com and www.mazad-jo.com. Setting it here would re-pin one
          # host and reintroduce the bug.
          VITE_FIREBASE_API_KEY: AIzaSyDpGyYrneZqX578TcD95LogNPsDwOHX1EA
          VITE_FIREBASE_PROJECT_ID: mazadjoapp
          VITE_FIREBASE_STORAGE_BUCKET: mazadjoapp.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '622832200971'
          # The "Mazad Jo" web app, not the ai-studio-applet-webapp the fallback
          # points at — analytics were landing on the scaffold registration.
          VITE_FIREBASE_APP_ID: '1:622832200971:web:95a4095b06d2ee8029460e'

      # Official Google auth: writes the service-account key from the secret and
      # exports GOOGLE_APPLICATION_CREDENTIALS for all following steps. firebase-tools
      # authenticates via those Application Default Credentials.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy hosting
        run: firebase deploy --only hosting --project mazadjoapp --non-interactive --force
